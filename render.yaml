# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Two services. The split matters: the web service used to run the Flask app,
# the background AI workers *and* the in-process APScheduler auto-publisher all
# in one process, which is why it was pinned to a single worker — a second
# worker would duplicate every scheduled publish and split the cache.
#
# The scheduler now takes a single-runner lease (Redis SET NX EX, see
# app/scheduler.py) and the cache is shared through Redis, so the worker count
# is a real tuning knob again. Redis is declared here as a managed instance
# rather than left optional: without it the cache and the rate-limit counters
# are per-process, and /healthz reports that as degraded.
#
# Server tuning lives in gunicorn.conf.py, with the reasoning next to each
# value, instead of in an uncommentable command-line string.
#
# To deploy: push to GitHub, then in the Render dashboard choose
# "New +" → "Blueprint" and point it at the repo. Render reads this file and
# prompts for every env var marked `sync: false`.

services:
  - type: web
    name: scriptly-ai
    runtime: python
    # Free tier spins down after 15 minutes idle (~50s cold start for the next
    # visitor) and gives 0.1 shared CPU / 512 MB, against a baseline import
    # footprint of roughly 250-350 MB for flask + firebase-admin + grpc +
    # numpy + google-generativeai. Starter is the first plan with headroom.
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py main:app

    # /readyz performs a real Firestore read and answers 503 when it cannot
    # serve, so a broken instance is drained instead of kept in rotation.
    # The previous check pointed at /, which returns a 302 to the login page
    # whether or not any dependency is reachable.
    healthCheckPath: /readyz

    envVars:
      # --- Runtime config (safe to keep in the repo) ---
      - key: PYTHON_VERSION
        # Latest 3.11 patch line. 3.11.0 was the initial release and is missing
        # several years of security fixes.
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: FLASK_APP
        value: main.py

      # --- Server tuning ---
      # Keep at 1 until the AI task pool moves to a shared broker: task state
      # lives in the worker that accepted the job, so a status poll can land on
      # a worker that has never heard of that task id. gunicorn.conf.py warns
      # at boot if this is raised.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "8"

      # --- Logging / observability ---
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      # Optional. With a DSN set and sentry-sdk installed, unhandled
      # exceptions are reported with their request id.
      - key: SENTRY_DSN
        sync: false

      # --- Uploads ---
      # Object storage, not the container filesystem. Local disk is ephemeral:
      # every deploy wiped the gallery while its Firestore metadata survived,
      # leaving permanently broken image links.
      - key: UPLOAD_BACKEND
        value: firebase
      - key: UPLOAD_MAX_MB
        value: "5"

      # --- Redis (shared cache, rate-limit counters, scheduler lease) ---
      - key: REDIS_URL
        fromService:
          type: redis
          name: scriptly-redis
          property: connectionString

      # --- Secrets — set in the Render dashboard, never committed ---
      - key: SECRET_KEY
        # Render can generate this. ProductionConfig.validate() refuses to boot
        # on a placeholder or a value shorter than 32 characters.
        generateValue: true
      # Paste the FULL service-account JSON as a single value; the app parses
      # either a file path or a raw JSON string.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # Firebase Web SDK (client) config
      - key: FB_API_KEY
        sync: false
      - key: FB_AUTH_DOMAIN
        sync: false
      - key: FB_PROJECT_ID
        sync: false
      # Also the bucket used for gallery uploads.
      - key: FB_STORAGE_BUCKET
        sync: false
      - key: FB_SENDER_ID
        sync: false
      - key: FB_APP_ID
        sync: false
      - key: FB_MEASUREMENT_ID
        sync: false

      # RapidAPI keys (SEO / keyword research / site audit)
      - key: RAPIDAPI_KEY
        sync: false
      - key: AHREFS_RAPIDAPI_KEY
        sync: false
      - key: SITE_AUDIT_RAPIDAPI_KEY
        sync: false

      # Email (Gmail SMTP) for newsletters and invitations
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FROM_NAME
        sync: false

      # Google OAuth for the Analytics integration. After the first deploy,
      # add https://<your-service>.onrender.com/... to the authorised redirect
      # URIs in the Google Cloud console.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

  # Cache, rate-limit counters and the scheduler's single-runner lease. All
  # three are optional in the sense that the app boots without them — and all
  # three become per-process when it does, which silently breaks cache
  # invalidation and multiplies every rate limit by the worker count.
  - type: redis
    name: scriptly-redis
    plan: starter
    region: oregon
    # Only the web service may connect. An empty allow-list would expose the
    # instance to the public internet.
    ipAllowList: []
    # Evict the least-recently-used key when full rather than returning errors:
    # this holds a cache and short-lived counters, none of which must persist.
    maxmemoryPolicy: allkeys-lru
