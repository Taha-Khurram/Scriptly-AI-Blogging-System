<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_config.app_name if app_config else 'Scriptly' }}{% endblock %}</title>

    <!-- Theme: restore the stored choice before first paint so the canvas never
         flashes the wrong surface. No stored value = follow the OS. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('scriptly-theme');
                if (t === 'dark' || t === 'light') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) { }
        })();
    </script>

    <!-- Favicon -->
    {% if app_config and app_config.app_favicon %}
    <link rel="icon" href="{{ app_config.app_favicon }}">
    {% else %}
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/logo.png') }}">
    {% endif %}

    <!-- Light/dark surface hint for the browser chrome -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F0F4F9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)">

    <!-- Fonts - Inter (stand-in for Google Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Material Symbols is self-hosted (see the @font-face at the top of
         dashboard.css) so the nav icons can never fall back to raw ligature
         text because a CDN request failed. Preload it: it is above-the-fold
         chrome on every screen. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
        href="{{ url_for('static', filename='fonts/material-symbols-outlined.woff2') }}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Custom Dashboard CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v=14">

    {% block extra_css %}{% endblock %}
</head>

<body class="bg-body">
    <!-- Navigation Progress Bar -->
    <div id="nav-progress"></div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loader -->
    <div id="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- App Wrapper -->
    <div class="app-wrapper">
        <main class="w-100 p-0">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Bootstrap & Main JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="{{ url_for('static', filename='js/app.js') }}?v=9"></script>
    <script src="{{ url_for('static', filename='js/pages/activity-tracker.js') }}" defer></script>

    {% block extra_js %}{% endblock %}
</body>

</html>
