{# Public unsubscribe page, reached from a link in a newsletter email.
   A real template rather than an f-string in the route: the previous version
   interpolated the `email` query parameter straight into the markup, including
   into an attribute value, which made `?email="><script>...` a reflected XSS on
   the application's own origin. Jinja autoescaping is what removes that whole
   class of bug rather than patching one instance of it. #}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {# This page must never appear in search results. #}
    <meta name="robots" content="noindex, nofollow">
    <title>{{ heading }}</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --panel: #ffffff;
            --text: #1a1a2e;
            --muted: #6b7280;
            --border: #e5e7eb;
            --brand: #4318ff;
            --brand-hover: #3614cc;
            --ok: #059669;
            --warn: #d97706;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1117;
                --panel: #171923;
                --text: #f3f4f6;
                --muted: #9ca3af;
                --border: #2d3748;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI",
                  Roboto, Helvetica, Arial, sans-serif;
        }
        .panel {
            width: 100%;
            max-width: 460px;
            padding: 40px 32px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            text-align: center;
        }
        h1 { margin: 0 0 12px; font-size: 1.375rem; font-weight: 600; }
        p { margin: 0 0 20px; color: var(--muted); }
        .address {
            display: inline-block;
            max-width: 100%;
            overflow-wrap: anywhere;
            padding: 8px 12px;
            margin-bottom: 24px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.9375rem;
            color: var(--text);
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: 0;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            font: inherit;
            font-weight: 500;
            cursor: pointer;
        }
        .btn:hover { background: var(--brand-hover); }
        .status-ok   { color: var(--ok); }
        .status-warn { color: var(--warn); }
    </style>
</head>
<body>
    <main class="panel">
        {% if state == 'confirm' %}
            <h1>{{ heading }}</h1>
            <p>You will stop receiving emails at this address.</p>
            {% if email %}
                <div class="address">{{ email }}</div>
            {% endif %}
            <form method="post">
                {# Carried in the form rather than re-read from the query string
                   on POST, so the address the user confirmed is the address
                   that gets unsubscribed. #}
                <input type="hidden" name="email" value="{{ email or '' }}">
                <input type="hidden" name="owner" value="{{ owner or '' }}">
                <button type="submit" class="btn">Confirm unsubscribe</button>
            </form>

        {% elif state == 'done' %}
            <h1 class="status-ok">{{ heading }}</h1>
            <p>{{ message }}</p>

        {% else %}
            <h1 class="status-warn">{{ heading }}</h1>
            <p>{{ message }}</p>
        {% endif %}
    </main>
</body>
</html>
