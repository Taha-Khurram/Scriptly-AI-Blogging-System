[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: takes more than a second; deselect with -m "not slow"
    integration: exercises more than one layer together

filterwarnings =
    error::DeprecationWarning:app.*
    # google-generativeai is end-of-life and its import emits a FutureWarning on
    # every run. Tracked as a migration to the `google.genai` package; ignored
    # here so it does not bury real warnings. Remove this line with the
    # migration, not before.
    ignore:.*google\.generativeai.*:FutureWarning
