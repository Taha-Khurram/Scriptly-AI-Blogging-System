# Continuous integration.
#
# There was no pipeline: a change that broke the test suite or introduced an
# undefined name reached the deployed branch with nothing in between. This runs
# on every push and pull request, and the deploy branch is protected by it.
#
# Deliberately fast (~2 minutes) so it is not something people learn to skip:
# no matrix over Python versions the project does not target, and dependencies
# are cached.

name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

# Cancel a superseded run on the same branch. Without this, pushing three
# commits in a minute queues three full runs and the useful one waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches runtime.txt and the deployment. Testing on a version the
          # project does not deploy tells you about the wrong interpreter.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check for undefined names and unused imports
        # pyflakes over the whole project. Cheap, zero false positives in
        # practice, and catches the class of error that only surfaces when a
        # rarely-taken branch runs in production.
        run: pyflakes app/ config.py main.py gunicorn.conf.py scripts/ tests/

      - name: Verify every module imports
        # A syntax error or a circular import in a module no test touches would
        # otherwise reach production and fail at request time.
        run: python -m compileall -q app/ config.py main.py gunicorn.conf.py scripts/

      - name: Verify the production config refuses a weak secret
        # The guard that stops a deploy running with a guessable SECRET_KEY.
        # If it stops raising, that protection is gone silently.
        run: |
          python - <<'PY'
          import os
          os.environ.update(
              FLASK_ENV='production',
              SECRET_KEY='changeme',
              FIREBASE_SERVICE_ACCOUNT='{}',
              GEMINI_API_KEY='x',
          )
          import importlib, config
          importlib.reload(config)
          try:
              config.ProductionConfig.validate()
          except config.ConfigurationError as exc:
              print('OK, refused as expected:', exc)
          else:
              raise SystemExit('FAIL: a placeholder SECRET_KEY was accepted')
          PY

      - name: Run tests
        env:
          FLASK_ENV: testing
        run: pytest -q --cov=app --cov=config --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reported, not gate-keeping: a CVE published in a transitive dependency
    # should not block an unrelated bug fix from shipping. Read the output.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Audit pinned dependencies for known vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc

      - name: Check for committed secrets
        # A pattern scan, not a substitute for a real secret scanner -- it
        # catches the mistake of committing .env or a service-account key.
        run: |
          if git ls-files | grep -qiE '(^|/)\.env$|serviceAccountKey\.json'; then
            echo "::error::A secret file is tracked in git"
            git ls-files | grep -iE '(^|/)\.env$|serviceAccountKey\.json'
            exit 1
          fi
          echo "No secret files tracked."
